global:
  domain: argo.moshire.co.uk

configs:
  params:
    server.insecure: true   # TLS ends at NGINX; ArgoCD serves plain HTTP behind it

server:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: default-issuer
    tls: true                # chart makes the tls block; secret is argocd-server-tls