apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/mshire96/eks-platform.git
    targetRevision: main
    path: k8s/argocd/local          # local app files
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd               # Apps live in argo cd ns
  syncPolicy:
    automated:
      prune: true                   # deleting app file makes argo cd delete the app
      selfHeal: true