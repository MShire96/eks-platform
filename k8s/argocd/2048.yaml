apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: '2048'
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mshire96/eks-platform.git
    targetRevision: main
    path: k8s/apps/2048
  destination:
    server: https://kubernetes.default.svc
    namespace: '2048'            # put the app in its own namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true         # create the whoami namespace if it doesn't exist