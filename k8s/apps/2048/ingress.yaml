apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: '2048'
  annotations:
    cert-manager.io/cluster-issuer: default-issuer
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - app.moshire.co.uk
    secretName: 2048-tls
  rules:
  - host: app.moshire.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: '2048'
            port:
              number: 80    # the Service's port, not the app's