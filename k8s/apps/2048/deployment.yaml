apiVersion: apps/v1
kind: Deployment
metadata:
  name: '2048'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: '2048'
  template:
    metadata:
      labels:
        app: '2048'
    spec:
      containers:
      - name: '2048'
        image: ghcr.io/mshire96/2048:df58080
        ports:
        - containerPort: 80
        readinessProbe:            # "is it ready for traffic?"
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:             # "is it still alive, or should it be restarted?"
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi