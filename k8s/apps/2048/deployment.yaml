apiVersion: apps/v1
kind: Deployment
metadata:
  name: '2048'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: '2048'
  template:
    metadata:
      labels:
        app: '2048'
    spec:
      containers:
      - name: '2048'
        image: ghcr.io/mshire96/2048:v1
        ports:
        - containerPort: 8080
        readinessProbe:            # "is it ready for traffic?"
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:             # "is it still alive, or should it be restarted?"
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi