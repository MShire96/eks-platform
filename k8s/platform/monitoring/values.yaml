# Shorter name to prefix with kps
fullnameOverride: kps

# --- Control-plane parts we can't reach ---
# On k3s these run inside the k3s process; on EKS, AWS runs them and hides them.
kubeControllerManager:
  enabled: true
kubeScheduler:
  enabled: true
kubeEtcd:
  enabled: true
kubeProxy:
  enabled: true

prometheus:
  prometheusSpec:
    retention: 3d                      # keep 3 days of data
    # By default Prometheus only collects from ServiceMonitors created by this
    # same Helm release. These two lines let it collect from any of them,
    # which you need for NGINX in step 4.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

grafana:
  admin:
    existingSecret: grafana-admin      # read the login from secret
    userKey: admin-user
    passwordKey: admin-password

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: default-issuer
    hosts:
      - grafana.moshire.co.uk
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.moshire.co.uk

  # Grafana loads any ConfigMap with this label as a dashboard.
  # This is how your own dashboards will get in, from Git, in step 5.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL