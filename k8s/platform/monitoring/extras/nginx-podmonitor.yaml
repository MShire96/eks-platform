apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nginx-ingress
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - nginx-ingress                       
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-ingress 
  podMetricsEndpoints:
    - port: prometheus                      
      interval: 30s