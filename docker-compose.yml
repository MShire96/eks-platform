name: eks-platform

services:
  ministack:
    image: ministackorg/ministack:1.5.37
    container_name: ministack
    ports:
      - "4566:4566"
    environment:
      GATEWAY_PORT: "4566"
      LOG_LEVEL: INFO
      MINISTACK_REGION: us-east-1
      S3_PERSIST: "0"
      EKS_BASE_PORT: "16443"
      EKS_K3S_IMAGE: rancher/k3s:v1.37.2-k3s1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped